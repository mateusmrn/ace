name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build CodeMirror bundle
        run: npm run build

      - name: Package .ankiaddon (smoke test)
        run: python3 scripts/package.py --skip-build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ankiaddon-${{ github.sha }}
          path: dist/*.ankiaddon
